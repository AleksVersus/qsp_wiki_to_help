# ============================================================================
# Единственный файл настроек qsp_help_builder (решение от 2026-10-16, п.2).
# Значений by-default в коде нет — без этого файла сборка не запускается.
# Все относительные пути считаются от папки этого файла (корень проекта),
# запуск из любого CWD даёт одинаковый результат (чинка backlog handoff §4.1).
# Временные входы/выходы сборки лежат в игнорируемом .build/; docs/ оставлен
# отслеживаемым как опубликованный источник GitHub Pages.
#
# Каждый параметр пересажен дословно из старого кода (указан источник),
# чтобы выход совпадал с бейзлайном _baseline/2026-10-16.
# ============================================================================

# --- Этап выгрузки страниц (источник: qsp_wiki_downloader.py) ---
[wiki]
base_url = "https://wiki.qsp.org"
timeout_sec = 30.0
delay_sec = 0.5
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

# --- Пути (рабочие входы/выходы сборки) ---
# note: мёртвый ключ 'start_file' из старого dict не перенесён — код его не читал.
[paths]
src = ".build/wiki"
out = ".build/chm"
images = ".build/wiki/images"                 # куда downloader кладёт скачанные картинки
scheme = ".build/wiki/urls_links_to_files.json"
anchors = ".build/wiki/anchors.json"

# --- Одностраничник (SPA): гибрид index.html + папка images/ рядом ---
[spa]
out = ".build/spa"                         # временный каталог одностраничника
start_page = "start"                        # slug первой страницы (открывается без хеша)
res = "assets/spa"                          # статические ресурсы SPA -> .build/spa

# --- PWA: то же, что SPA, + манифест + service worker + поиск ---
# Оболочка одностраничника для хостинга (GitHub Pages). Каталог вывода — `docs`:
# GitHub Pages автоматически берёт папку `docs/` в ветке как корень сайта (Deploy from a
# branch). Пути в выходных артефактах (manifest/sw/поиск/иконка) относительные, поэтому
# сборка одинаково работает и в корне домена, и в под-пути проекта (/<repo>/).
[pwa]
out = "docs"                                 # каталог выхода PWA (папка /docs — авто-источник GitHub Pages)
start_page = "start"                        # slug первой страницы (открывается без хеша)
name = "QSP — справка"                      # полное имя приложения в манифесте
short_name = "QSP"                          # короткое имя (ярлык на рабочем столе)
theme_color = "#2f6db0"                     # цвет темы интерфейса (совпадает с spa.css)
background_color = "#f4f5f7"                # фон сплэш-экрана/установки
# display: standalone | fullscreen | minimal-ui | browser
# standalone — без элементов браузера (ощущение нативного приложения)
display = "standalone"
icon = "images/help_wiki_logo.png"          # иконка манифеста (уже в выходе как картинка start)

# --- Docusaurus (режим docs): дерево .md-документов по уровням содержания ---
# Pages из содержания (sidebar) раскладываются по вложенным папкам; вне содержания ->
# help_add/. Порядок задают _category_.json (папки) и sidebar_position (файлы), а числа
# и цели ссылок переживают пересборку в мутируемых JSON-базах в [docusaurus].bases.
[docusaurus]
out = ".build/docusaurus_docs"                     # временное дерево документов (Docusaurus docs.path)
bases = ".build/docusaurus_docs/.docusaurus_build" # сохраняемые базы нумерации/ссылок
start_page = "start"                          # slug, которому отдаётся корень (position 1)

# --- Подготовка CHM (источник: ChmPrepare; keys 'hhc'/'hhk' и хардкод qsp.hhc/qsp.hhk) ---
[chm]
res = "assets/chm"                  # статические ресурсы CHM -> .build/chm
hhc_source = "sidebar.htm"          # скачанный help:sidebar -> основа содержания
hhk_source = "help_keywords.htm"    # скачанный help:keywords -> основа указателя
hhc_output = "qsp.hhc"
hhk_output = "qsp.hhk"
page_encoding = "utf-8"             # htm-страницы
index_encoding = "windows-1251"     # hhc/hhk: требование HTML Help Workshop

# --- Исключаемые разделы (источник: self.files_to_del в ChmPrepare.__init__) ---
[exclude]
files = [
    "discussions",
    "help_aeroqsp",
    "help_fajl_css_igry_v_quest_navigator",
    "help_fajl_js_igry_v_quest_navigator",
    "help_fajl_nastroek_igry_v_quest_navigator",
    "help_ispolzovanie_shriftov_v_quest_navigator",
    "help_navigator_command_line",
    "help_navigator_game_files",
    "help_navigator_game_template",
    "help_navigator_standalone",
    "help_sozdanie_igr_na_quest_navigator",
    "playground_contents_what_dif_goto_gosub.md",
    "index",
    "playground_playground",
    "help_navigator",
]

# --- Логирование (источник: logging.basicConfig в шапке qsp_wiki_downloader.py) ---
[logging]
level = "DEBUG"
download_log = ".build/logs/wiki_download.log"

# --- Отдельный вход из исходников Docusaurus Markdown ---
# markdown-sync делает sparse checkout только docs_path в игнорируемый source-каталог.
# Страница/папка выбирается вручную через pages.json; эта настройка независима от
# [docusaurus], который по-прежнему генерирует Docusaurus Markdown из wiki HTML.
[docusaurus_markdown]
repository = "https://github.com/QSPFoundation/qspfoundation.github.io.git"
ref = "main"
docs_path = "docs"
source = ".build/docusaurus_source"
pages = "docusaurus_markdown/pages.json"
toc = "docusaurus_markdown/toc.json"
chm_out = ".build/docusaurus_markdown/chm"
spa_out = ".build/docusaurus_markdown/spa"
pwa_out = ".build/docusaurus_markdown/pwa"
state = ".build/docusaurus_markdown/state"
